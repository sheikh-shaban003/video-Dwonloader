services:
  website:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8088:8080"
    environment:
      PORT: "8080"
      STATIC_DIR: /app/public
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_RESPONSES_MODEL: ${OPENAI_RESPONSES_MODEL:-gpt-6-astra}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-}
      MAX_CONCURRENT_DOWNLOADS: ${MAX_CONCURRENT_DOWNLOADS:-2}
      MAX_DOWNLOADS_PER_IP: ${MAX_DOWNLOADS_PER_IP:-1}
      DOWNLOAD_TIMEOUT_MS: ${DOWNLOAD_TIMEOUT_MS:-3600000}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
